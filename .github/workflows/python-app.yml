# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./calculator

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.14
      uses: actions/setup-python@v3
      with:
        python-version: "3.14"
    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: uv sync --python 3.14
      
    - name: Lint with flake8
      run: |
        #  Stop the build if there are Python syntax errors or undefined names
        uv run --python 3.14 flake8 src/calculator --count --select=E9,F63,F7,F82 --show-source --statistics

        # Treat other errors as warnings
        uv run --python 3.14 flake8 src/calculator --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
   
    - name: Test with pytest
      run: uv run --python 3.14 pytest --cov=calculator --cov-report=term-missing
