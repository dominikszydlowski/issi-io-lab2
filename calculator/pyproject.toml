
[project]
name = "calculator"
version = "0.1.0"
description = "MicroProjekt na zalicznie Lab2"
readme = "README.md"
authors = [
    { name = "Dominik", email = "dominic.szydlowski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "requests>=2.34.2",
]

[project.scripts]
calculator = "calculator:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "flake8>=7.5.0",
    "pylint>=4.1.3",
    "pytest>=9.2.0",
]

[tool.coverage.run]
omit = ["*/__init__.py"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
