[project]
name = "calculator"
version = "0.1.0"
description = "NanoProjekt na zalicznie Lab2"
readme = "README.md"
authors = [
    { name = "Dominik", email = "dominic.szydlowski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
calculator = "calculator:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.2",
    "pytest>=9.2.0",
]

[tool.coverage.run]
omit = ["*/__init__.py"]
