[project]
name = "playwright-tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dominik", email = "dominic.szydlowski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
playwright-tests = "playwright_tests:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--base-url=https://www.informatyka.agh.edu.pl"

[dependency-groups]
dev = [
    "playwright>=1.65.0",
    "pytest-playwright>=0.10.0",
]
